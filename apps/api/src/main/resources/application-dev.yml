spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:orbit_db}
    username: ${DB_USERNAME:orbit_user}
    password: ${DB_PASSWORD:orbit_pass}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis_pass}
  jpa:
    show-sql: true

logging:
  level:
    com.orbit.platform: DEBUG
    org.springframework.security: DEBUG
