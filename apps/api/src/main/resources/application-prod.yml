spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
  jpa:
    show-sql: false
  security:
    oauth2:
      resourceserver:
        jwt:
          # Full OIDC discovery + issuer-claim validation in production.
          issuer-uri: ${OIDC_ISSUER_URI}

management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.orbit.platform: INFO
    org.springframework: WARN
