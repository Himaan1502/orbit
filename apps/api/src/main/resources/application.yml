spring:
  application:
    name: orbit
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  security:
    oauth2:
      resourceserver:
        jwt:
          # Tokens are issued by the self-hosted OIDC provider (apps/auth, Spring
          # Authorization Server) — see ADR-004. The API never signs or holds a
          # shared secret; it validates RS256 signatures against the provider JWKS.
          # Default/dev use jwk-set-uri (lazy fetch, signature validation only);
          # prod adds issuer-uri for OIDC discovery + issuer-claim validation.
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:9000/oauth2/jwks}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: orbit
        format_sql: true
  flyway:
    enabled: true
    schemas: orbit
    default-schema: orbit
    locations: classpath:db/migration

server:
  port: 8080
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /api/swagger-ui

orbit:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
  security:
    # JWT claim carrying granted authorities (array or space-delimited string).
    authorities-claim: ${OIDC_AUTHORITIES_CLAIM:roles}
    authorities-prefix: ${OIDC_AUTHORITIES_PREFIX:ROLE_}
  # Priority Engine v1 (Blueprint §22, ADR-014). Weights must sum to 1.0 — the
  # context refuses to start otherwise. Defaults are Blueprint §22's values.
  priority:
    weights:
      career-relevance: 0.20
      skill-gap: 0.20
      dependency-impact: 0.15
      project-impact: 0.15
      interview-value: 0.10
      urgency: 0.10
      available-time-fit: 0.05
      historical-completion-probability: 0.05
  planning:
    # Daily budget when the user's profile has no available_daily_minutes (ADR-015 §2).
    default-available-minutes: 120
    # Effort assumed for a task with no estimate, when packing a plan (ADR-015 §2).
    default-task-minutes: 30
  # Skill Scoring v1 (Blueprint §23, ADR-017). Weights must sum to 1.0 — the
  # context refuses to start otherwise. Defaults are Blueprint §23's values.
  skills:
    scoring:
      weights:
        knowledge: 0.20
        practical: 0.25
        evidence: 0.20
        interview: 0.15
        production: 0.20
  # Career readiness component blend (ADR-018 §1, amended by ADR-026 §2). Must
  # sum to 1.0 — the context refuses to start otherwise. Renormalised among the
  # components that have data. Ratified 2026-09-08.
  career:
    readiness:
      skill-capability-weight: 0.45
      interview-readiness-weight: 0.20
      evidence-coverage-weight: 0.20
      project-coverage-weight: 0.15
      evidence-gap-capability-bar: 0.50
  # Derived roadmap progress + intersection tunables (ADR-023 §4). Fractions in
  # [0,1]; startup-validated (RoadmapsConfig). Starting values — tune later.
  roadmaps:
    topic-covered-threshold: 0.70
    career-relevance-high: 0.66
    career-relevance-medium: 0.40
    action-band-build: 0.30
    action-band-operate: 0.60
    action-band-maintain: 0.85
  # Evidence -> skill-assessment confidence (ADR-026 §1). Evidence raises
  # confidence, never a dimension score. Startup-validated.
  evidence:
    partial-threshold: 0.40
    verified-threshold: 1.00
    verified-min-types: 2
