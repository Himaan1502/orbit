spring:
  application:
    name: orbit
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  security:
    oauth2:
      resourceserver:
        jwt:
          # Tokens are issued by the self-hosted OIDC provider (apps/auth, Spring
          # Authorization Server) — see ADR-004. The API never signs or holds a
          # shared secret; it validates RS256 signatures against the provider JWKS.
          # Default/dev use jwk-set-uri (lazy fetch, signature validation only);
          # prod adds issuer-uri for OIDC discovery + issuer-claim validation.
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:9000/oauth2/jwks}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: orbit
        format_sql: true
  flyway:
    enabled: true
    schemas: orbit
    default-schema: orbit
    locations: classpath:db/migration

server:
  port: 8080
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /api/swagger-ui

orbit:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
  security:
    # JWT claim carrying granted authorities (array or space-delimited string).
    authorities-claim: ${OIDC_AUTHORITIES_CLAIM:roles}
    authorities-prefix: ${OIDC_AUTHORITIES_PREFIX:ROLE_}
