spring:
  # PostgreSQL and Redis are provided by Testcontainers via the test base class
  # (AbstractApiIntegrationTest) — the suite is hermetic on any machine with a
  # Docker daemon (Milestone 1 objective 7). No localhost assumptions, no Redis
  # password mismatch.
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
  flyway:
    clean-disabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          # Placeholder JWKS URI — never contacted. Tests authenticate with
          # spring-security-test (SecurityMockMvcRequestPostProcessors.jwt()),
          # so the decoder is built lazily and no auth server is required.
          jwk-set-uri: http://localhost:9000/oauth2/jwks

logging:
  level:
    com.orbit.platform: INFO
