spring:
  application:
    name: orbit-auth
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:orbit_db}
    username: ${DB_USERNAME:orbit_user}
    password: ${DB_PASSWORD:orbit_pass}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      # The auth server owns the `auth` schema (ADR-011). Pin every pooled
      # connection's search_path so the Spring Authorization Server JDBC repos
      # and Flyway resolve unqualified table names there.
      connection-init-sql: SET search_path TO auth, public

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: auth
        format_sql: true

  flyway:
    enabled: true
    schemas: auth
    default-schema: auth
    create-schemas: true
    locations: classpath:db/migration

  thymeleaf:
    cache: ${THYMELEAF_CACHE:true}

server:
  port: ${AUTH_SERVER_PORT:9000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

orbit:
  auth:
    # The OIDC issuer identifier. Must be the SAME URL the browser and every
    # resource server use to reach this server. See ADR-004 "Consequences".
    issuer: ${OIDC_ISSUER_URI:http://localhost:9000}
    web-client:
      client-id: ${WEB_CLIENT_ID:orbit-web}
      # Confidential client (the BFF server, not the browser) — see ADR-013.
      # Not committed; supplied via .env for local, a secret in every other env.
      client-secret: ${WEB_CLIENT_SECRET:orbit-local-dev-web-client-secret-change-me}
      redirect-uri: ${WEB_REDIRECT_URI:http://localhost:3000/auth/callback}
      post-logout-redirect-uri: ${WEB_POST_LOGOUT_URI:http://localhost:3000}
    # Secret used to derive the AES-256-GCM key that seals signing-key private
    # material at rest (ADR-011 §3). Not committed; supplied via .env for local.
    keystore-secret: ${AUTH_KEYSTORE_SECRET:orbit-local-dev-keystore-secret-change-me}
    dev-user:
      username: ${AUTH_DEV_USER:dev@orbit.local}
      # Leave blank to skip seeding. When set (dev profile only) an account with
      # this email/password is upserted on startup for a stable local login.
      password: ${AUTH_DEV_PASSWORD:}
    registration:
      min-password-length: 12
      max-password-length: 128
    rate-limit:
      # Requests per minute per client IP for the login / register form POSTs.
      login-per-minute: 10
      register-per-minute: 5
      # Consecutive failures for one email before a temporary cooldown.
      max-login-failures: 10
      lockout-minutes: 15

logging:
  level:
    com.orbit.auth: ${AUTH_LOG_LEVEL:INFO}
    org.springframework.security: ${SECURITY_LOG_LEVEL:INFO}
