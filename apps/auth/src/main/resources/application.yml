spring:
  application:
    name: orbit-auth
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: ${AUTH_SERVER_PORT:9000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

orbit:
  auth:
    # The OIDC issuer identifier. Must be the SAME URL the browser and every
    # resource server use to reach this server. See ADR-004 "Consequences".
    issuer: ${OIDC_ISSUER_URI:http://localhost:9000}
    web-client:
      client-id: ${WEB_CLIENT_ID:orbit-web}
      redirect-uri: ${WEB_REDIRECT_URI:http://localhost:3000/auth/callback}
      post-logout-redirect-uri: ${WEB_POST_LOGOUT_URI:http://localhost:3000}
    dev-user:
      username: ${AUTH_DEV_USER:dev@orbit.local}
      # Leave blank to generate + log a random password on startup.
      password: ${AUTH_DEV_PASSWORD:}

logging:
  level:
    com.orbit.auth: ${AUTH_LOG_LEVEL:INFO}
    org.springframework.security: ${SECURITY_LOG_LEVEL:INFO}
