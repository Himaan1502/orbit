name: ORBIT CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm run test -- --run

      - name: Build
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # PostgreSQL + Redis are started by Testcontainers inside the test JVM
      # (ubuntu-latest runners ship a Docker daemon). No service containers, no
      # localhost / password assumptions — see docs/engineering/deferred-items.md.
      - name: Build and Test
        run: ./gradlew build
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Checkstyle
        run: ./gradlew checkstyleMain || true

      - name: SpotBugs
        run: ./gradlew spotbugsMain || true

  auth:
    name: Auth Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/auth
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # PostgreSQL is started by Testcontainers inside the test JVM.
      - name: Build and Test
        run: ./gradlew build
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Checkstyle
        run: ./gradlew checkstyleMain || true

      - name: SpotBugs
        run: ./gradlew spotbugsMain || true
